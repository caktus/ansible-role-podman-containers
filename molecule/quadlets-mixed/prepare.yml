---
- name: Prepare instance
  hosts: all
  gather_facts: false

  tasks:
    - name: List all containers
      delegate_to: localhost
      become: false
      ansible.builtin.shell: podman ps -a
      register: all_containers
      changed_when: false
      run_once: true

    - name: Print all containers
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: |
          All containers:
          {{ all_containers.stdout }}
      run_once: true

    - name: Check instance container specifically
      delegate_to: localhost
      become: false
      ansible.builtin.shell: podman inspect instance 2>/dev/null || echo "NOT_FOUND"
      register: instance_status
      changed_when: false
      ignore_errors: true
      run_once: true

    - name: Print instance container status
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: |
          Instance container status: {{ instance_status.stdout | default('NOT FOUND') }}
      run_once: true

    - name: Fail if instance container is not found or exited
      delegate_to: localhost
      become: false
      ansible.builtin.fail:
        msg: "Container 'instance' is not running! Status: {{ instance_status.stdout | default('NOT FOUND') }}"
      when:
        - instance_status.stdout == 'NOT_FOUND' or 'exited' in instance_status.stdout.lower()
      run_once: true

    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60
      ignore_errors: true

    - name: Ensure Ansible tmp directory exists
      ansible.builtin.raw: mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp
      changed_when: false
      ignore_errors: true

    - name: Wait for systemd to initialize
      ansible.builtin.shell: systemctl is-system-running || systemctl is-system-running | grep -q degraded
      register: systemd_status
      changed_when: false
      retries: 30
      delay: 1
      until: systemd_status.rc == 0 or 'degraded' in systemd_status.stdout
      ignore_errors: true

    - name: Activate network-online.target for quadlet services
      ansible.builtin.raw: systemctl start network-online.target
      changed_when: true
      ignore_errors: true

    - name: Start user systemd instance for root (user@0)
      ansible.builtin.raw: systemctl start user@0.service
      changed_when: true
      ignore_errors: true
