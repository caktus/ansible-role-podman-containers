---
# Shared prepare playbook for all molecule scenarios.
# Waits for the systemd-based container to fully initialize before converge.
- name: Prepare instance
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60

    - name: Ensure Ansible tmp directory exists
      ansible.builtin.raw: mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp
      changed_when: false

    - name: Wait for systemd to initialize
      ansible.builtin.shell: systemctl is-system-running || systemctl is-system-running | grep -q degraded
      register: systemd_status
      changed_when: false
      retries: 30
      delay: 1
      until: systemd_status.rc == 0 or 'degraded' in systemd_status.stdout

    - name: Start network-online.target
      ansible.builtin.systemd:
        name: network-online.target
        state: started

    - name: Start dbus socket (socket-activated on RHEL/CentOS via dbus-broker)
      ansible.builtin.systemd:
        name: dbus.socket
        state: started
        enabled: true

    - name: Debug - Check dbus socket status
      ansible.builtin.command: systemctl status dbus.socket
      changed_when: false
      failed_when: false
      register: dbus_socket_status

    - name: Debug - Show dbus socket status
      ansible.builtin.debug:
        var: dbus_socket_status.stdout_lines

    - name: Debug - Check dbus-broker service status
      ansible.builtin.command: systemctl status dbus-broker.service
      changed_when: false
      failed_when: false
      register: dbus_broker_status

    - name: Debug - Show dbus-broker status
      ansible.builtin.debug:
        var: dbus_broker_status.stdout_lines

    - name: Start user systemd instance for root (user@0)
      ansible.builtin.systemd:
        name: user@0.service
        state: started
      retries: 3
      delay: 2
      register: user_systemd
      until: user_systemd is success
      ignore_errors: true

    - name: Debug - Check user@0 service status on failure
      ansible.builtin.command: systemctl status user@0.service
      changed_when: false
      failed_when: false
      register: user_systemd_status
      when: user_systemd is failed

    - name: Debug - Show user@0 status on failure
      ansible.builtin.debug:
        var: user_systemd_status.stdout_lines
      when: user_systemd is failed

    - name: Debug - Get journalctl logs for user@0 on failure
      ansible.builtin.command: journalctl -xeu user@0.service --no-pager
      changed_when: false
      failed_when: false
      register: user_systemd_journal
      when: user_systemd is failed

    - name: Debug - Show journalctl logs for user@0 on failure
      ansible.builtin.debug:
        var: user_systemd_journal.stdout_lines
      when: user_systemd is failed

    - name: Fail if user@0 service did not start
      ansible.builtin.fail:
        msg: "user@0.service failed to start. See debug output above."
      when: user_systemd is failed
