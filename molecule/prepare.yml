---
# Shared prepare playbook for all molecule scenarios.
# Waits for the systemd-based container to fully initialize before converge.
- name: Prepare instance
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60

    - name: Ensure Ansible tmp directory exists
      ansible.builtin.raw: mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp
      changed_when: false

    - name: Wait for systemd to initialize
      ansible.builtin.shell: systemctl is-system-running || systemctl is-system-running | grep -q degraded
      register: systemd_status
      changed_when: false
      retries: 30
      delay: 1
      until: systemd_status.rc == 0 or 'degraded' in systemd_status.stdout

    - name: Start required systemd services for user sessions
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: started
        enabled: "{{ item.enabled | default(omit) }}"
      loop:
        - name: network-online.target
        - name: dbus.socket
          enabled: true
      register: dbus_start

    - name: Ensure dbus-broker service is running
      ansible.builtin.command: systemctl is-active dbus-broker.service
      register: dbus_broker_check
      changed_when: false
      retries: 10
      delay: 1
      until: dbus_broker_check.rc == 0
      failed_when: false

    - name: Trigger dbus socket to start broker if needed
      ansible.builtin.command: dbus-send --system --print-reply --dest=org.freedesktop.DBus / org.freedesktop.DBus.Peer.Ping
      changed_when: false
      failed_when: false
      when: dbus_broker_check.rc != 0

    - name: Wait for dbus system bus to be accessible
      ansible.builtin.command: systemctl is-active dbus-broker.service
      register: dbus_final_check
      changed_when: false
      retries: 10
      delay: 1
      until: dbus_final_check.rc == 0

    - name: Start user systemd instance for root (user@0)
      ansible.builtin.systemd:
        name: user@0.service
        state: started
      retries: 3
      delay: 2
      register: user_systemd
      until: user_systemd is success
