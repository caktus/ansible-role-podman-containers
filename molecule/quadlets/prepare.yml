---
- name: Prepare
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check container status
      ansible.builtin.shell: podman ps -a --filter name=instance
      register: container_state
      changed_when: false

    - name: Show container state
      ansible.builtin.debug:
        msg: "Container state: {{ container_state.stdout }}"

    - name: Show container logs
      ansible.builtin.shell: podman logs instance 2>&1 | tail -20
      changed_when: false
      ignore_errors: true

- name: Prepare instance
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait 5 seconds for container to stabilize
      ansible.builtin.pause:
        seconds: 5

    - name: Wait for container to be ready (with extended timeout)
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60
      ignore_errors: true

    - name: Ensure Ansible tmp directory exists
      ansible.builtin.raw: mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp
      changed_when: false
      ignore_errors: true

    - name: Wait for systemd to initialize
      ansible.builtin.shell: systemctl is-system-running || systemctl is-system-running | grep -q degraded
      register: systemd_status
      changed_when: false
      retries: 30
      delay: 1
      until: systemd_status.rc == 0 or 'degraded' in systemd_status.stdout
      ignore_errors: true

    - name: Activate network-online.target for quadlet services
      ansible.builtin.raw: systemctl start network-online.target
      changed_when: true
      ignore_errors: true

    - name: Start user systemd instance for root (user@0)
      ansible.builtin.raw: systemctl start user@0.service
      changed_when: true
      ignore_errors: true
