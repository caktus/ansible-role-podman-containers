---
# Scenario: Traefik labels — socket activation + Traefik container discovery
# Tests that socket units, Traefik static/middleware config, and container
# labels are created correctly in quadlet mode.
driver:
  name: podman

platforms:
  - name: ubuntu
    image: docker.io/library/ubuntu:questing
    dockerfile: ../Dockerfile.j2
    command: ""
    pre_build_image: false
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  - name: rhel
    image: quay.io/centos/centos:stream9
    dockerfile: ../Dockerfile.rhel.j2
    command: ""
    pre_build_image: false
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

provisioner:
  name: ansible
  playbooks:
    prepare: ../prepare.yml
    converge: ../converge.yml
  inventory:
    group_vars:
      all:
        podman_user: root
        podman_user_home: /root
        podman_use_quadlets: yes
        podman_uid: "0"
        podman_default_network: app
        podman_networks:
          - name: app
        podman_traefik_enabled: true
        podman_traefik_acme_email: ""
        podman_traefik_log_level: DEBUG
        podman_socket_units:
          - name: http
            fd_name: web
            port: 8080
            service: traefik
          - name: https
            fd_name: websecure
            port: 8443
            service: traefik
        podman_containers:
          - name: socket-proxy
            image: ghcr.io/tecnativa/docker-socket-proxy
            tag: latest
            volumes:
              - "/run/user/0/podman/podman.sock:/var/run/docker.sock:ro,Z"
            env:
              CONTAINERS: "1"
              EVENTS: "1"
              POST: "0"
          - name: whoami
            image: docker.io/traefik/whoami
            tag: latest
            label:
              traefik.enable: "true"
              traefik.http.routers.whoami.rule: "PathPrefix(`/`)"
              traefik.http.routers.whoami.entrypoints: "traefik-internal"
              traefik.http.services.whoami.loadbalancer.server.port: "80"
              traefik.http.services.whoami.loadbalancer.healthcheck.path: "/health"
              traefik.http.services.whoami.loadbalancer.healthcheck.interval: "2s"
              traefik.http.services.whoami.loadbalancer.healthcheck.timeout: "1s"
              traefik.http.services.whoami.loadbalancer.healthcheck.scheme: "http"
              app.role: whoami

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy

verifier:
  name: ansible
