---
- name: Prepare
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait for systemd to initialize
      ansible.builtin.command: systemctl is-system-running
      register: systemd_status
      until: systemd_status.stdout in ['running', 'degraded']
      retries: 30
      delay: 1
      changed_when: false

    - name: Activate network-online.target for quadlet services
      ansible.builtin.raw: systemctl start network-online.target
      changed_when: true
      ignore_errors: true

    - name: Start user systemd instance for root (user@0)
      ansible.builtin.raw: systemctl start user@0.service
      changed_when: true
      ignore_errors: true
