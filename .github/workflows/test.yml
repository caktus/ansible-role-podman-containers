---
name: Molecule Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "molecule/**"
      - "tasks/**"
      - "defaults/**"
      - "handlers/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "molecule/**"
      - "tasks/**"
      - "defaults/**"
      - "handlers/**"

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - legacy-pod
          - quadlets
          - quadlets-mixed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check initial podman version
        run: podman --version

      - name: Add Kubic PPA for newer podman
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:kubic:libcontainers:stable/xUbuntu_24.04/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/libcontainers-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/libcontainers-archive-keyring.gpg] https://download.opensuse.org/repositories/devel:kubic:libcontainers:stable/xUbuntu_24.04/ /" | sudo tee /etc/apt/sources.list.d/libcontainers.list > /dev/null
        continue-on-error: true

      - name: Install newer podman from Kubic PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
        continue-on-error: true

      - name: Show upgraded podman version
        run: podman --version

      - name: Install dependencies
        run: uv sync

      - name: Run Molecule (${{ matrix.scenario }})
        run: uv run molecule test -s ${{ matrix.scenario }}
