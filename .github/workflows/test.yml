---
name: Molecule Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "molecule/**"
      - "tasks/**"
      - "defaults/**"
      - "handlers/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "molecule/**"
      - "tasks/**"
      - "defaults/**"
      - "handlers/**"

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - legacy-pod
          - quadlets
          - quadlets-mixed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Check podman version
        run: podman --version

      - name: Upgrade podman (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
        continue-on-error: true

      - name: Show upgraded podman version
        run: podman --version

      - name: Run Molecule (${{ matrix.scenario }})
        run: uv run molecule test -s ${{ matrix.scenario }}
