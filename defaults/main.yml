# The "deploy user" as which containers will be run. Note,
# you're still responsible for setting up Ansible connection details
# to SSH to the server as this user.
podman_user: ubuntu

# Home directory of podman_user
podman_user_home: "/home/{{ podman_user }}"

# Directories to create for the podman_user. The quadlet directory
# (podman_quadlet_dir) is created separately when podman_use_quadlets is enabled.
podman_directories:
  - "{{ podman_user_home }}/log/"
  - "{{ podman_user_home }}/.config/systemd/user/"

# Git repositories to build. For example:
#
# podman_build_repos:
#   - repo: git@bitbucket.org:my_org/my_repo.git
#     version: "{{ commit_sha | default(git_branch) }}"
#     dest_dir: "{{ podman_user_home }}/my_repo"
#     image_name: my_repo
podman_build_repos: []

# REMOVED: podman_pod_name has been removed and no longer has any effect.
# To put containers in a pod, explicitly set 'pod: pod_name' on each container.
# For network-based setups, use podman_networks with podman_use_quadlets: yes instead.
# See the README for migration examples.
# podman_pod_name: app

# Default network for containers that don't specify their own network.
# If set, containers without a `network` defined will use this network.
# Container-level `network` always overrides this default.
# Note: This value should NOT include the .network suffix; containers that
# need to reference a quadlet network file must include .network in their
# own network definition.
# podman_default_network: app

# Podman pods to create. Containers in a pod share a network namespace
# and are started/stopped together.
# Requires: Podman 3.0+ (legacy mode), Podman 5.0+ (quadlet .pod files)
# See: https://docs.ansible.com/ansible/latest/collections/containers/podman/podman_pod_module.html
podman_pods: []

# Podman containers to create.
# See: https://docs.ansible.com/ansible/latest/collections/containers/podman/podman_container_module.html
#
# Example (network-based):
# podman_containers:
#   - name: redis
#     image: docker.io/redis
#     tag: latest
#     # No network specified - uses podman_default_network if defined
#   - name: web
#     image: localhost/myapp
#     tag: latest
#     # No network specified - uses podman_default_network if defined
#     env:
#       REDIS_URL: "redis://redis:6379/0"
podman_containers: []

# REMOVED: podman_pod_inherit_hostname has been removed and no longer has any effect.
# Instead, set hostname: "%H" directly on pods or containers that should
# inherit the host's hostname. See the README for examples.
# podman_pod_inherit_hostname: no

# Delete pods/containers before recreating. Use when changing network config.
podman_delete_before_create: no

# Always recreate pods and containers on deploy
podman_recreate: no

# Default log driver for containers
# podman_log_driver: k8s-file

# Default log options for containers
# podman_log_opt:
#   path: "{{ podman_user_home }}/log/{{ item.name }}.log"

# Podman networks to create. Containers on a shared network communicate by name.
# See: https://docs.ansible.com/ansible/latest/collections/containers/podman/podman_network_module.html
podman_networks: []

# Use Quadlets instead of `podman generate systemd`.
# Recommended for new deployments. May become the default in a future version.
# Requires: Podman 4.4+ for .container/.network files, Podman 5.0+ for .pod files
# See: https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html
podman_use_quadlets: no

# Directory for quadlet files
podman_quadlet_dir: "{{ podman_user_home }}/.config/containers/systemd/"

# Directory for env_as_file environment files (no trailing slash)
podman_env_file_dir: "{{ podman_user_home }}/env"

# --- Socket activation ---
# List of systemd socket units to create. Each binds a port and passes the
# file descriptor to a container service on activation.
# Each entry:
#   name: http              # Creates ~/.config/systemd/user/http.socket
#   fd_name: web            # FileDescriptorName — must match the Traefik entryPoint name
#   port: 80                # ListenStream port
#   service: traefik        # Service= directive (the container service to activate)
podman_socket_units: []

# --- Traefik ---
podman_traefik_enabled: false
podman_traefik_image: docker.io/traefik
podman_traefik_tag: v3
podman_traefik_config_dir: "{{ podman_user_home }}/traefik"
podman_traefik_log_level: INFO
podman_traefik_acme_email: ""           # Set to enable Let's Encrypt. Leave empty to disable ACME.
podman_traefik_acme_storage: /etc/traefik/acme/acme.json
podman_traefik_extra_volumes: []        # Additional volumes for the Traefik container
podman_traefik_quadlet_options: []      # Extra quadlet directives for the Traefik container
podman_traefik_extra_static_config: {}  # Deep-merged into traefik.yaml (advanced overrides)
podman_traefik_container: {}            # Full override of the auto-generated Traefik container definition
podman_traefik_middlewares: {}          # Dict merged into http.middlewares in middlewares.yaml

# Numeric UID of podman_user. Required when using socket-proxy.
# Set to: "{{ lookup('pipe', 'id -u ' + podman_user) }}"
# or derive it in a task before the role runs.
podman_uid: ""
